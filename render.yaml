# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the FastAPI backend and the React frontend as two free services.
#
# The free web service has an ephemeral disk: voting.db is recreated and
# reseeded with the sample proposals on every deploy/restart, so votes and
# new proposals do not persist. Free services also sleep after ~15 min idle.

services:
  # ── FastAPI backend ──
  - type: web
    name: voting-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python seed_db.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Random token generated by Render; copy it from the service's
      # Environment tab and paste it into the Admin Token field in the UI.
      - key: ADMIN_TOKEN
        generateValue: true

  # ── React (Vite) frontend ──
  - type: web
    name: voting-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Serve index.html for client-side routes so refreshing /admin works
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Public URL of voting-api, e.g. https://voting-api.onrender.com
      # (prompted when the Blueprint is created; Vite bakes it in at build time)
      - key: VITE_API_URL
        sync: false
